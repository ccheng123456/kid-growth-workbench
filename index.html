<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>峡谷词汇战记 · 全量+例句语法版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#171a24;color:#e8e6f0;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
#wrap{max-width:560px;margin:0 auto;padding:14px 14px 30px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:18px;font-weight:700;color:#f0c869}
.badge{background:#202536;border:1px solid #3a4058;border-radius:10px;padding:6px 10px;font-size:12px;text-align:center}
.badge b{color:#f0c869;font-size:14px}
.xpbar{height:8px;background:#202536;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.xpfill{height:100%;background:#5dcaa5;width:0%;transition:width .4s}
.xpline{display:flex;justify-content:space-between;font-size:11px;color:#8a8fa8;margin-bottom:12px}
.daily{display:flex;gap:8px;align-items:center;background:#202536;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:12px}
.daily .fire{font-size:20px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
nav button{background:#202536;border:1px solid #3a4058;color:#c9c7d8;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
nav button.on{background:#534ab7;border-color:#7f77dd;color:#fff}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:12px;flex-wrap:wrap}
.filters select{background:#202536;border:1px solid #3a4058;color:#e8e6f0;border-radius:8px;padding:5px 8px;font-size:12px}
.filters label{display:flex;align-items:center;gap:4px;color:#8a8fa8;cursor:pointer}
.pane{display:none}
.pane.on{display:block}
.card{background:#202536;border:1px solid #3a4058;border-radius:16px;padding:22px 18px;text-align:center}
.big{font-size:34px;font-weight:700;color:#fff;letter-spacing:.5px}
.phon{font-size:15px;color:#f0c869;margin-top:6px}
.pos{font-size:13px;color:#8a8fa8;margin-top:2px}
.mean{font-size:17px;color:#5dcaa5;margin-top:10px;line-height:1.5}
.tagline{margin-top:12px;font-size:12px;color:#7f77dd}
.mnemo{margin-top:10px;background:#262041;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;color:#c7c0f0;text-align:left}
.sline{margin-top:8px;background:#1d2b28;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;text-align:left}
.sline .en{color:#9fe1cb}.sline .zh{color:#8a8fa8;font-size:12px;margin-top:3px}
.hint{font-size:12px;color:#5f6479;margin-top:10px}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;background:#3a4058;border:none;color:#fff;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.row button.main{background:#534ab7}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts button{background:#202536;border:1px solid #3a4058;color:#e8e6f0;padding:13px 10px;border-radius:12px;font-size:14px;line-height:1.45;cursor:pointer;text-align:left}
.opts button.correct{background:#1d4d3b;border-color:#5dcaa5}
.opts button.wrongpick{background:#4d1d24;border-color:#e24b4a}
.fb{margin-top:14px;font-size:14px;line-height:1.6;text-align:left;min-height:20px}
.fb.good{color:#5dcaa5}.fb.bad{color:#e24b4a}
.spell-in{width:100%;background:#171a24;border:2px solid #3a4058;border-radius:10px;color:#fff;font-size:20px;padding:12px;text-align:center;margin-top:14px;letter-spacing:1px}
.spell-in:focus{outline:none;border-color:#7f77dd}
.progress{font-size:12px;color:#8a8fa8;margin-bottom:8px}
.combo{position:fixed;top:38%;left:0;right:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
.combo.show{opacity:1;animation:pop .5s}
.combo .txt{font-size:42px;font-weight:800;color:#f0c869;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.combo .sub{font-size:14px;color:#e8e6f0}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50}
.overlay.show{display:flex}
.overlay .r{font-size:34px;font-weight:800;color:#f0c869;margin-bottom:8px}
.overlay .d{font-size:14px;color:#c9c7d8;margin-bottom:20px}
.overlay button{background:#534ab7;color:#fff;border:none;padding:12px 34px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#2b3148;color:#fff;padding:8px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.revive-item{background:#202536;border:1px solid #3a4058;border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:13px;display:flex;justify-content:space-between}
.revive-item .n{color:#e24b4a;font-size:12px}
.timer{font-size:22px;font-weight:800;color:#f0c869;text-align:center;margin-bottom:10px}
.gramtag{display:inline-block;background:#262041;color:#c7c0f0;border-radius:8px;padding:3px 10px;font-size:12px;margin-top:4px}
footer{text-align:center;font-size:11px;color:#5f6479;margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="wrap">
<header>
  <h1>⚔️ 峡谷词汇战记</h1>
  <div class="badge"><span id="rankName">倔强青铜</span><br><b id="pwNum">0</b> 战力</div>

<div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
<div class="xpline"><span id="xpTxt">经验 0</span><span id="stWrong">复活甲 0</span></div>

<nav>
  <button data-p="read" class="on">📖 认读</button>
  <button data-p="quiz">🎯 选义</button>
  <button data-p="spell">✏️ 默写</button>
  <button data-p="sent">💬 例句</button>
  <button data-p="gram">📜 语法</button>

<div class="filters" id="filterRow">

  <label><input type="checkbox" id="weakChk"> 只背没掌握的</label>
</div>

<div class="pane on" id="pane-read">

    <div class="phon" id="rdPhon"></div>

  <div class="row"><button id="rdPrev">← 上一个</button><button class="main" id="rdNext">下一个 →</button></div>
</div>

<div class="pane" id="pane-quiz">
  <div class="progress" id="qzTag">0 / 0</div>
  <div class="card">
    <div class="big" id="qzWord"></div>
    <div class="phon" id="qzPhon"></div>
    <div class="opts" id="qzOpts"></div>
    <div class="fb" id="qzFb"></div>
    <div class="mnemo" id="qzMnemo" style="display:none"></div>
    <div class="sline" id="qzSent" style="display:none"><div class="en"></div><div class="zh"></div></div>
    <div class="row"><button class="main" id="qzNext">下一题 →</button></div>
  </div>
</div>

<div class="pane" id="pane-spell">
  <div class="progress" id="spTag">0 / 0</div>
  <div class="card">
    <div class="pos" id="spPos"></div>
    <div class="mean" id="spMean"></div>
    <input class="spell-in" id="spInput" placeholder="拼出英文" autocomplete="off" autocapitalize="off">
    <div class="fb" id="spFb"></div>
    <div class="sline" id="spSent" style="display:none"><div class="en"></div><div class="zh"></div></div>
    <div class="row"><button id="spHint">💡 提示</button><button id="spSkip">跳过</button><button class="main" id="spCheck">提交</button></div>
  </div>
</div>

<div class="pane" id="pane-sent">
  <div class="progress" id="seTag">0 / 0</div>
  <div class="card">
    <div class="mean" style="color:#9fe1cb;font-size:16px" id="seSentEn"></div>
    <div class="pos" id="seSentZh"></div>
    <div class="opts" id="seOpts"></div>
    <div class="fb" id="seFb"></div>
    <div class="row"><button class="main" id="seNext">下一题 →</button></div>
  </div>
</div>

<div class="pane" id="pane-gram">
  <div class="progress" id="grTag">0 / 0</div>
  <div class="card">
    <div class="mean" style="color:#e8e6f0;font-size:16px;text-align:left" id="grQ"></div>
    <div class="opts" id="grOpts" style="grid-template-columns:1fr 1fr"></div>
    <div class="fb" id="grFb"></div>
    <div class="gramtag" id="grTagChip" style="display:none"></div>
    <div class="row"><button class="main" id="grNext">下一题 →</button></div>
  </div>
</div>

<div class="pane" id="pane-speed">
  <div class="timer" id="tmLeft">60</div>
  <div class="card">
    <div class="big" id="tmWord"></div>
    <div class="opts" id="tmOpts"></div>
    <div class="fb" id="tmFb"></div>
    <div class="row"><button class="main" id="tmStart">开始挑战</button></div>
  </div>
</div>

<div class="pane" id="pane-revive">
  <div class="progress" id="rvTag">复活甲里共有 0 个对手</div>
  <div class="row"><button class="main" id="rvStart">⚔️ 复活甲复习</button><button id="rvClear">清空复活甲</button></div>
  <div id="rvList" style="margin-top:12px"></div>
</div>

<footer>经验·段位·错题进度自动保存在本设备 · 少年，去上分吧！⚔️</footer>
</div>

<div class="combo" id="combo"><div class="txt"></div><div class="sub"></div></div>
<div class="overlay" id="rankUp"><div class="r"></div><div class="d"></div><button onclick="this.parentNode.classList.remove('show')">继续征战</button></div>
<div class="toast" id="toast"></div>

const GUARD = {};
(function(){
  const byName = {}; HEROES.forEach(h=>byName[h.n]=h);
  WORDS.forEach(w=>{
    let hero = null;
    for (const [kw,h] of KEY_HERO){ if (w[3].includes(kw) || w[0].toLowerCase().includes(kw)) { hero = byName[h]; break; } }
    if (!hero){
      const role = /v\.|aux/.test(w[2]) ? ['战士','刺客','法师'][w[0].length%3] : ['坦克','射手','辅助','法师'][w[0].length%4];
      const pool = HEROES.filter(h=>h.r===role);
      hero = pool[w[0].length % pool.length];
    }
    GUARD[w[0]] = hero;
  });
})();
function guardTag(word){

}

const RANKS=[["倔强青铜",0],["秩序白银",150],["荣耀黄金",400],["尊贵铂金",800],["永恒钻石",1400],["至尊星耀",2200],["最强王者",3200],["荣耀王者",4500]];
const COMBOS={2:"双杀！",3:"三杀！",4:"四杀！",5:"五杀！",7:"超神！"};
const LS='vocab_canyon_v5';
let S={known:{},xp:0,wrong:{},grWrong:{},best:0,daily:{date:'',xp:0,streak:0,last:''}};
try{const raw=localStorage.getItem(LS);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}

function save(){localStorage.setItem(LS,JSON.stringify(S));}
function today(){return new Date().toDateString();}
function checkDaily(){
  const t=today();
  if(S.daily.date!==t){
    const y=new Date(Date.now()-864e5).toDateString();
    S.daily.streak=(S.daily.last===y)?(S.daily.streak||0)+1:1;
    S.daily.date=t;S.daily.xp=0;S.daily.last=t;save();
  }
}
function rankOf(xp){let r=0;RANKS.forEach((x,i)=>{if(xp>=x[1])r=i;});return r;}
function gainXP(n){
  const before=rankOf(S.xp);
  S.xp+=n;S.daily.xp+=n;save();renderTop();
  const after=rankOf(S.xp);
  if(after>before)showRankUp(after);
}
function showRankUp(r){
  const ov=document.getElementById('rankUp');
  ov.querySelector('.r').textContent='🎉 段位提升！'+RANKS[r][0];
  ov.querySelector('.d').textContent=RANKS[r][0]+'的召唤师，词汇峡谷因你而闪耀！';
  ov.classList.add('show');sfx('up');
}
function renderTop(){
  const r=rankOf(S.xp);
  document.getElementById('rankName').textContent=RANKS[r][0];
  document.getElementById('pwNum').textContent=Object.keys(S.known).length;
  document.getElementById('dXP').textContent=S.daily.xp||0;
  document.getElementById('dStreak').textContent='连续 '+(S.daily.streak||0)+' 天';
  document.getElementById('stWrong').textContent='复活甲 '+Object.keys(S.wrong).length;
  const cur=RANKS[r][1],nxt=RANKS[Math.min(r+1,RANKS.length-1)][1];
  const pct=nxt>cur?Math.min(100,(S.xp-cur)/(nxt-cur)*100):100;
  document.getElementById('xpFill').style.width=pct+'%';
  document.getElementById('xpTxt').textContent='经验 '+S.xp+(nxt>S.xp?(' / 下一级 '+nxt):' · 已满级');
}
let toastTimer=null;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1600);}
function showCombo(n){
  const key=COMBOS[Math.min(n,7)];
  if(!key)return;
  const el=document.getElementById('combo');
  el.querySelector('.txt').textContent=key;
  el.querySelector('.sub').textContent=n+' 连击！继续保持！';
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1200);
}
let AC=null;
function sfx(type){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    if(type==='ok'){o.type='triangle';o.frequency.value=880;g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.start();o.stop(AC.currentTime+.25);}
    else if(type==='err'){o.type='sawtooth';o.frequency.value=160;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.3);o.start();o.stop(AC.currentTime+.3);}
    else{o.type='square';[523,659,784,1047].forEach((f,i)=>{const oo=AC.createOscillator(),gg=AC.createGain();oo.connect(gg);gg.connect(AC.destination);oo.frequency.value=f;gg.gain.setValueAtTime(.12,AC.currentTime+i*.12);gg.gain.exponentialRampToValueAtTime(.001,AC.currentTime+i*.12+.3);oo.start(AC.currentTime+i*.12);oo.stop(AC.currentTime+i*.12+.3);});}
  }catch(e){}
}
function speak(t){
  try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function unitOf(w){return w[4];}
let poolBase=[];
function rebuildPool(){
  const u=+document.getElementById('unitSel').value;
  const weak=document.getElementById('weakChk').checked;
  poolBase=WORDS.filter(w=>!u||w[4]===u);
  if(weak)poolBase=poolBase.filter(w=>S.wrong[w[0]]&&!S.known[w[0]]);
  if(!poolBase.length)poolBase=WORDS.filter(w=>!u||w[4]===u);
}
function poolFor(){
  let p=poolBase.slice();
  if(document.getElementById('shufChk').checked)shuffle(p);
  return p;
}
function isPhrase(w){return /\s|\.\.\./.test(w[0]);}
function mnemoText(w){
  if(!isPhrase(w)&&MNEMO[w[0].toLowerCase()])return '💡 联想：'+MNEMO[w[0].toLowerCase()];
  return guardTag(w[0])||'';
}

/* ============ 认读 ============ */
let rdPool=[],rdIdx=-1,rdShown=false;
function rdStart(){rebuildPool();rdPool=poolFor();rdIdx=-1;rdNext();}
function rdNext(){
  rdIdx++;rdShown=false;
  if(rdIdx>=rdPool.length){rdIdx=0;}
  const w=rdPool[rdIdx];
  document.getElementById('rdWord').textContent=w[0];
  document.getElementById('rdPhon').textContent=w[1];
  const m=document.getElementById('rdMean');
  m.classList.add('hidden');m.textContent=(w[2]?w[2]+'  ':'')+w[3];
  const mn=document.getElementById('rdMnemo');
  const mt=mnemoText(w);
  mn.style.display=mt?'block':'none';mn.textContent=mt;
  const sl=document.getElementById('rdSent');
  const sn=SENT[w[0]];
  if(sn){sl.style.display='block';sl.querySelector('.en').textContent=sn[0];sl.querySelector('.zh').textContent=sn[1];}
  else sl.style.display='none';
  document.getElementById('readTag').textContent=(rdIdx+1)+' / '+rdPool.length+'（已掌握 '+Object.keys(S.known).length+'）';
  speak(w[0]);
}
document.getElementById('rdMean').parentNode.addEventListener('click',function(e){
  if(e.target.closest('button'))return;
  const m=document.getElementById('rdMean');
  if(!rdShown){m.classList.remove('hidden');rdShown=true;if(!S.known[rdPool[rdIdx][0].toLowerCase()]){S.known[rdPool[rdIdx][0].toLowerCase()]=1;gainXP(5);toast('+5 经验 · 拿下 '+rdPool[rdIdx][0]);save();renderTop();}}
  else rdNext();
});
document.getElementById('rdPrev').onclick=()=>{rdIdx-=2;if(rdIdx<-1)rdIdx=-1;rdShown=false;rdNext();};
document.getElementById('rdNext').onclick=()=>rdNext();

/* ============ 选义 ============ */
let qzPool=[],qzIdx=-1,qzLock=false,qzCombo=0;
function qzStart(){rebuildPool();qzPool=poolFor();qzIdx=-1;qzCombo=0;qzNext();}
function qzNext(){
  qzIdx++;qzLock=false;
  if(qzIdx>=qzPool.length){qzIdx=0;}
  const w=qzPool[qzIdx];
  document.getElementById('qzWord').textContent=w[0];
  document.getElementById('qzPhon').textContent=w[1];
  const fb=document.getElementById('qzFb');fb.textContent='';fb.className='fb';
  document.getElementById('qzMnemo').style.display='none';
  document.getElementById('qzSent').style.display='none';
  const opts=[[w[3],true]];
  const pool=WORDS.filter(x=>x[0]!==w[0]);
  shuffle(pool);
  for(const o of pool){if(opts.length>=4)break;if(o[3]!==w[3])opts.push([o[3],false]);}
  shuffle(opts);
  const box=document.getElementById('qzOpts');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.textContent=o[0];
    b.onclick=()=>pickOpt(b,o,w);
    box.appendChild(b);
  });
  document.getElementById('qzTag').textContent=(qzIdx+1)+' / '+qzPool.length+' · 连击 '+qzCombo;
  speak(w[0]);
}
function pickOpt(btn,o,w){
  if(qzLock)return;qzLock=true;
  const fb=document.getElementById('qzFb');
  if(o[1]){
    btn.classList.add('correct');
    qzCombo++;if(qzCombo>=2)showCombo(qzCombo);
    const bonus=qzCombo>=3?5:0;
    gainXP(10+bonus);
    sfx('ok');
    fb.className='fb good';
    fb.textContent='✅ 答对！+10 经验'+(bonus?(' · 连击加成 +'+bonus):'');
    if(!S.known[w[0].toLowerCase()]){S.known[w[0].toLowerCase()]=1;}
    const mt=mnemoText(w);
    if(mt){document.getElementById('qzMnemo').textContent=mt;document.getElementById('qzMnemo').style.display='block';}
    const sn=SENT[w[0]];
    if(sn){const sl=document.getElementById('qzSent');sl.style.display='block';sl.querySelector('.en').textContent=sn[0];sl.querySelector('.zh').textContent=sn[1];}
  }else{
    btn.classList.add('wrongpick');
    qzCombo=0;sfx('err');
    S.wrong[w[0]]=(S.wrong[w[0]]||0)+1;
    fb.className='fb bad';
    fb.textContent='❌ 正确答案：'+w[3]+'（已收入复活甲，答错的词稍后还会来找你）';
  }
  save();renderTop();
}
document.getElementById('qzNext').onclick=()=>qzNext();

/* ============ 默写 ============ */
let spPool=[],spIdx=-1,spCur=null,spHints=0,spDone=false;
function spStart(){rebuildPool();spPool=poolFor();spIdx=-1;spNext();}
function spNext(){
  spIdx++;spHints=0;spDone=false;
  if(spIdx>=spPool.length)spIdx=0;
  spCur=spPool[spIdx];
  document.getElementById('spPos').textContent=spCur[2]||'';
  document.getElementById('spMean').textContent=spCur[3];
  const inp=document.getElementById('spInput');inp.value='';inp.disabled=false;
  const fb=document.getElementById('spFb');fb.textContent='';fb.className='fb';
  const sn=SENT[spCur[0]];
  const sl=document.getElementById('spSent');
  if(sn){sl.style.display='block';sl.querySelector('.en').textContent=sn[0];sl.querySelector('.zh').textContent=sn[1];}
  else sl.style.display='none';
  document.getElementById('spTag').textContent=(spIdx+1)+' / '+spPool.length;
  speak(spCur[0]);
  inp.focus();
}
function spCheck(){
  if(spDone)return;
  const inp=document.getElementById('spInput');
  const fb=document.getElementById('spFb');
  const v=inp.value.trim();
  if(!v){fb.textContent='先拼出来，或者点提示';fb.className='fb bad';return;}
  if(v.toLowerCase()===spCur[0].toLowerCase()){
    spDone=true;inp.disabled=true;
    const firstPass=spHints===0;
    fb.className='fb good';
    if(firstPass){gainXP(15);fb.textContent='✅ 一遍过！Master！+15 经验';if(!S.known[spCur[0].toLowerCase()])S.known[spCur[0].toLowerCase()]=1;}
    else{gainXP(8);fb.textContent='✅ 正确！+8 经验（用了提示，下次试试裸背）';}
    sfx('ok');
    if(S.wrong[spCur[0]]){delete S.wrong[spCur[0]];toast(spCur[0]+' 复活成功！移出复活甲');}
    save();renderTop();
  }else{
    S.wrong[spCur[0]]=(S.wrong[spCur[0]]||0)+1;save();
    fb.className='fb bad';
    const a=v.toLowerCase().split(''),b=spCur[0].toLowerCase().split('');
    let diff=0;for(let i=0;i<Math.max(a.length,b.length);i++)if(a[i]!==b[i])diff++;
    fb.textContent='❌ 差了 '+diff+' 处。正确答案：'+spCur[0]+' —— 已收入复活甲';
    sfx('err');renderTop();
    setTimeout(()=>{inp.value='';inp.focus();},1200);
  }
}
document.getElementById('spCheck').onclick=spCheck;
document.getElementById('spInput').addEventListener('keydown',e=>{if(e.key==='Enter')spCheck();});
document.getElementById('spHint').onclick=()=>{
  if(spDone)return;spHints++;
  const w=spCur[0];
  document.getElementById('spInput').value=w.slice(0,Math.max(1,Math.ceil(w.length*spHints/3)))+'…';
  document.getElementById('spFb').textContent='提示：首字母是 "'+w[0]+'"，共 '+w.length+' 个字符';
  document.getElementById('spFb').className='fb';
};
document.getElementById('spSkip').onclick=()=>{
  if(spDone)return;spDone=true;
  S.wrong[spCur[0]]=(S.wrong[spCur[0]]||0)+1;save();renderTop();
  const fb=document.getElementById('spFb');
  fb.className='fb bad';
  fb.textContent='答案是：'+spCur[0]+' —— '+spCur[3]+'（已收入复活甲）';
};

/* ============ 例句填空 ============ */
let sePool=[],seIdx=-1,seLock=false;
function seBuildPool(){
  sePool=WORDS.filter(w=>SENT[w[0]]&&(!poolUnit()||w[4]===poolUnit()));
  if(document.getElementById('weakChk').checked)sePool=sePool.filter(w=>S.wrong[w[0]]);
  if(!sePool.length)sePool=WORDS.filter(w=>SENT[w[0]]);
  if(document.getElementById('shufChk').checked)shuffle(sePool);
}
function poolUnit(){return +document.getElementById('unitSel').value;}
function seStart(){seBuildPool();seIdx=-1;seNext();}
function seNext(){
  seIdx++;seLock=false;
  if(seIdx>=sePool.length)seIdx=0;
  const w=sePool[seIdx];
  const sn=SENT[w[0]];
  const blanked=sn[0].replace(new RegExp('\\b'+w[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*\\b','i'),'______');
  if(blanked===sn[0]){seNext();return;}
  document.getElementById('seSentEn').textContent=blanked;
  document.getElementById('seSentZh').textContent='中文提示：'+sn[1];
  const fb=document.getElementById('seFb');fb.textContent='';fb.className='fb';
  const opts=[[w[0],true]];
  const pool=WORDS.filter(x=>x[0]!==w[0]&&!isPhrase(x));
  shuffle(pool);
  for(const o of pool){if(opts.length>=4)break;opts.push([o[0],false]);}
  shuffle(opts);
  const box=document.getElementById('seOpts');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.textContent=o[0];
    b.onclick=()=>{
      if(seLock)return;seLock=true;
      if(o[1]){
        b.classList.add('correct');sfx('ok');
        gainXP(10);
        if(!S.known[w[0].toLowerCase()])S.known[w[0].toLowerCase()]=1;
        fb.className='fb good';
        fb.textContent='✅ '+sn[0]+'（'+sn[1]+'）· +10 经验';
        speak(w[0]);
      }else{
        b.classList.add('wrongpick');sfx('err');
        S.wrong[w[0]]=(S.wrong[w[0]]||0)+1;
        fb.className='fb bad';
        fb.textContent='❌ 答案是 '+w[0]+'：'+sn[0]+'（'+sn[1]+'）';
      }
      save();renderTop();
    };
    box.appendChild(b);
  });
  document.getElementById('seTag').textContent=(seIdx+1)+' / '+sePool.length;
}
document.getElementById('seNext').onclick=()=>seNext();

/* ============ 语法挑战 ============ */
let grPool=[],grIdx=-1,grLock=false;
function grStart(){grPool=shuffle(GRAMMAR.slice());grIdx=-1;grNext();}
function grNext(){
  grIdx++;grLock=false;
  if(grIdx>=grPool.length){grPool=shuffle(GRAMMAR.slice());grIdx=0;}
  const q=grPool[grIdx];
  document.getElementById('grQ').textContent=q[0].replace('___','______');
  const fb=document.getElementById('grFb');fb.textContent='';fb.className='fb';
  document.getElementById('grTagChip').style.display='none';
  const opts=q[1].map((t,i)=>[t,i===q[2]]);
  shuffle(opts);
  const box=document.getElementById('grOpts');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.textContent=o[0];
    b.onclick=()=>{
      if(grLock)return;grLock=true;
      if(o[1]){
        b.classList.add('correct');sfx('ok');
        gainXP(12);
        fb.className='fb good';
        fb.textContent='✅ 答对！+12 经验 · '+q[3];
      }else{
        b.classList.add('wrongpick');sfx('err');
        S.grWrong[q[0]]=(S.grWrong[q[0]]||0)+1;
        fb.className='fb bad';
        fb.textContent='❌ 正确答案：'+q[1][q[2]]+' · '+q[3];
      }
      document.getElementById('grTagChip').textContent='考点：'+q[4];
      document.getElementById('grTagChip').style.display='inline-block';
      save();
    };
    box.appendChild(b);
  });
  document.getElementById('grTag').textContent=(grIdx+1)+' / '+grPool.length+' · 本轮已刷 '+grPool.length+' 题';
}
document.getElementById('grNext').onclick=()=>grNext();

/* ============ 限时挑战 ============ */
let tmTimer=null,tmLeft=0,tmScore=0,tmLock=false,tmCur=null;
document.getElementById('tmStart').onclick=()=>{
  clearInterval(tmTimer);tmLeft=60;tmScore=0;tmLock=false;
  document.getElementById('tmFb').textContent='';
  document.getElementById('tmStart').textContent='挑战中…';
  tmTick();tmNext();
  tmTimer=setInterval(()=>{
    tmLeft--;tmTick();
    if(tmLeft<=0){clearInterval(tmTimer);tmEnd();}
  },1000);
};
function tmTick(){document.getElementById('tmLeft').textContent='⏱ '+tmLeft+'s · 击杀 '+tmScore;}
function tmNext(){
  tmLock=false;tmCur=WORDS[Math.floor(Math.random()*WORDS.length)];
  document.getElementById('tmWord').textContent=tmCur[0];
  const opts=[[tmCur[3],true]];
  const pool=WORDS.filter(x=>x[0]!==tmCur[0]);shuffle(pool);
  for(const o of pool){if(opts.length>=4)break;if(o[3]!==tmCur[3])opts.push([o[3],false]);}
  shuffle(opts);
  const box=document.getElementById('tmOpts');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.textContent=o[0];
    b.onclick=()=>{
      if(tmLock)return;tmLock=true;
      if(o[1]){tmScore++;sfx('ok');gainXP(3);}
      else{sfx('err');S.wrong[tmCur[0]]=(S.wrong[tmCur[0]]||0)+1;save();}
      tmTick();tmNext();
    };
    box.appendChild(b);
  });
  speak(tmCur[0]);
}
function tmEnd(){
  const fb=document.getElementById('tmFb');
  if(tmScore>S.best){S.best=tmScore;save();fb.className='fb good';fb.textContent='🏆 新纪录！本轮击杀 '+tmScore+'，历史最高！';sfx('up');}
  else{fb.className='fb bad';fb.textContent='本轮击杀 '+tmScore+' · 历史纪录 '+S.best+'，下次冲一冲？';}
  document.getElementById('tmStart').textContent='再来一局';
  renderTop();
}

/* ============ 复活甲 ============ */
function rvRender(){
  const keys=Object.keys(S.wrong);
  document.getElementById('rvTag').textContent='复活甲里共有 '+keys.length+' 个对手';
  const list=document.getElementById('rvList');list.innerHTML='';
  keys.sort((a,b)=>S.wrong[b]-S.wrong[a]).forEach(k=>{
    const d=document.createElement('div');d.className='revive-item';
    const meta=WORDS.find(w=>w[0].toLowerCase()===k.toLowerCase());
    d.innerHTML='<span>'+k+(meta?(' · '+meta[3].slice(0,14)):'')+'</span><span class="n">被打败 '+S.wrong[k]+' 次</span>';
    list.appendChild(d);
  });
}
document.getElementById('rvStart').onclick=()=>{
  const keys=Object.keys(S.wrong);
  if(!keys.length){toast('复活甲是空的，先去刷题喂饱它！');return;}
  qzPool=shuffle(keys.map(k=>WORDS.find(w=>w[0].toLowerCase()===k.toLowerCase())).filter(Boolean));
  qzIdx=-1;switchPane('quiz');qzNext();
  toast('复仇模式：答对一次即可移出复活甲');
};
document.getElementById('rvClear').onclick=()=>{
  if(!Object.keys(S.wrong).length)return;
  if(confirm('确定清空复活甲吗？错题记录将丢失。')){S.wrong={};save();rvRender();renderTop();}
};

/* ============ 面板切换与启动 ============ */
function switchPane(p){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.pane').forEach(el=>el.classList.remove('on'));
  document.getElementById('pane-'+p).classList.add('on');
  const fu=document.getElementById('filterRow');
  fu.style.display=(p==='read'||p==='quiz'||p==='spell')?'flex':'none';
  if(p==='read')rdStart();
  else if(p==='quiz')qzStart();
  else if(p==='spell')spStart();
  else if(p==='sent')seStart();
  else if(p==='gram')grStart();
  else if(p==='revive')rvRender();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchPane(b.dataset.p));
const sel=document.getElementById('unitSel');
for(let i=1;i<=16;i++){const o=document.createElement('option');o.value=i;o.textContent='单元 '+i;sel.appendChild(o);}
sel.onchange=()=>{rdStart();};
document.getElementById('shufChk').onchange=()=>rdStart();
document.getElementById('weakChk').onchange=()=>rdStart();

checkDaily();renderTop();rdStart();
</script>
